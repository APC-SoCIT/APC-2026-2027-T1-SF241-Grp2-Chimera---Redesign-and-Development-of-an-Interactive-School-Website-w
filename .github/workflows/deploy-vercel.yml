name: Deploy Chimera to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chimera-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Install Vercel CLI
        run: npm install --global vercel@66.4.0

      - name: Load production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" || -z "$VERCEL_TOKEN" ]]; then
            echo '::error::Set VERCEL_ORG_ID and VERCEL_PROJECT_ID as repository variables and VERCEL_TOKEN as an Actions secret.'
            exit 1
          fi
          vercel pull --yes --environment=production

      - name: Build for production
        run: vercel build --prod

      - name: Deploy, check the homepage, and promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --skip-domain --yes)
          if [[ ! "$deployment_url" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo '::error::Vercel did not return an expected deployment URL.'
            exit 1
          fi

          status=$(vercel curl "$deployment_url/" -- --fail --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}')
          if [[ "$status" != 200 ]]; then
            echo "::error::The staged homepage returned HTTP $status."
            exit 1
          fi

          node scripts/promote-vercel.mjs "$deployment_url"
          printf 'Deployed and promoted %s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
